apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
  labels:
    app: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics
          image: 940104439733.dkr.ecr.sa-east-1.amazonaws.com/togglemaster/analytics:latest
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: AWS_REGION
              value: "sa-east-1"
            - name: AWS_SQS_URL
              value: "https://sqs.sa-east-1.amazonaws.com/940104439733/togglemaster-events"
            - name: AWS_DYNAMODB_TABLE
              value: "ToggleMasterAnalytics"
            - name: PORT
              value: "8005"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15